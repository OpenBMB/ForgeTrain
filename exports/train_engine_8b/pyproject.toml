[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "training-engine-tensor"
version = "0.1.0"
description = "Single-host MiniCPM4-8B pretraining engine (HF dataloader + 3 self-developed CuTeDSL kernels)."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "triton>=3.3",
    "transformer-engine>=1.0",
    "nvidia-cutlass==4.5.0",
    "nvidia-cutlass-dsl==4.5.0",
    "numpy",
    "datasets",
    "transformers",
    "sentencepiece",
]

[project.optional-dependencies]
flash = ["flash-attn"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["training_engine_tensor*", "flash_attn_dsl*", "quack*"]

[tool.setuptools.package-data]
"training_engine_tensor.ops" = ["*/register.toml"]
"training_engine_tensor" = ["*.toml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "tomli", "torch", "torch.*", "transformer_engine",
    "training_engine_tensor.*", "flash_attn_dsl", "flash_attn_dsl.*",
    "quack", "quack.*", "cutlass", "cutlass.*", "triton", "triton.*",
    "transformers", "transformers.*", "datasets", "datasets.*",
    "sentencepiece", "tokenizers", "tokenizers.*",
]
ignore_missing_imports = true
